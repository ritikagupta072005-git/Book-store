<!DOCTYPE html>
<html>
<head>
<style>

body {
    margin: 0;
    min-height: 100vh;
    position: relative;
    text-align: center;
}

.login-box {
    margin-top: 60px;
}

.login-box h2 {
    color: #0B1F3A;
    font-size: 30px;
}

label {
    font-size: 18px;
}

input[type="text"],
input[type="password"] {
    width: 230px;
    height: 30px;
    margin-left: 8px;
}

.button {
    width: 120px;
    height: 42px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
}

.submit-btn {
    background-color: #0B1F3A;
    color: white;
    border: 2px solid #0B1F3A;
}

.reset-btn {
    background-color: #D4AF37;
    color: #0B1F3A;
    border: 2px solid #0B1F3A;
}

.footer {
    position: fixed;
    bottom: 8px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 14px;
    font-weight: bold;
    color: #0B1F3A;
    text-decoration: none;
}

</style>

</head>

<body>

    <div class="login-box">

        <h2>Login Page</h2>

        <form>

            <label>Username:</label>
            <input type="text" name="username">
            <br><br>

            <label>Password:</label>
            <input type="password" name="password">
            <br><br><br>

            <input type="submit"
                   value="Submit"
                   class="button submit-btn">

            &nbsp;&nbsp;

            <input type="reset"
                   value="Reset"
                   class="button reset-btn">

        </form>

    </div>

    <footer class="footer">
        Name: Ritika Gupta &nbsp; | &nbsp; Roll No.: 2501920110307
    </footer>

</body>
</html>
