<!DOCTYPE html>
<html>
<head>
    <title>Online Book Store</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        #topFrame {
            width: 100%;
            height: 30vh;
            border: none;
            display: block;
        }

        #container {
            display: flex;
            width: 100%;
            height: 70vh;
        }

        #leftFrame {
            width: 25%;
            height: 100%;
            border: none;
        }

        #rightFrame {
            width: 75%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

    <iframe src="top.html"
            id="topFrame"
            name="topFrame">
    </iframe>

    <div id="container">

        <iframe src="left.html"
                id="leftFrame"
                name="leftFrame">
        </iframe>

        <iframe src="right.html"
                id="rightFrame"
                name="rightFrame">
        </iframe>

    </div>

</body>
</html>
