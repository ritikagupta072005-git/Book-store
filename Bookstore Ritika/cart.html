<!DOCTYPE html>
<html>

<head>

<style>

body {
    margin: 0;
    min-height: 100vh;
    position: relative;
    text-align: center;
}

h2 {
    color: #0B1F3A;
    margin-top: 30px;
}

.cart-table {
    margin: 25px auto;
    border-collapse: collapse;
    width: 75%;
}

.cart-table th {
    background-color: #0B1F3A;
    color: white;
    padding: 12px;
    border: 2px solid black;
}

.cart-table td {
    padding: 12px;
    border: 2px solid black;
}

.total {
    font-weight: bold;
    text-align: right;
}

.button {
    font-size: 16px;
    font-weight: bold;
    padding: 10px 18px;
    border-radius: 6px;
    margin: 8px;
}

.continue {
    background-color: #D4AF37;
    color: #0B1F3A;
    border: 2px solid #0B1F3A;
}

.checkout {
    background-color: #0B1F3A;
    color: white;
    border: 2px solid #0B1F3A;
}

.footer {
    position: fixed;
    bottom: 8px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 14px;
    font-weight: bold;
    color: #0B1F3A;
}

</style>

</head>

<body>

<h2>Shopping Cart</h2>

<table class="cart-table">

    <tr>
        <th>Book Name</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Amount</th>
    </tr>

    <tr>
        <td>Introduction to Algorithms</td>
        <td>Rs. 2999</td>
        <td>1</td>
        <td>Rs. 2999</td>
    </tr>

    <tr>
        <td>Electronic Devices</td>
        <td>Rs. 745</td>
        <td>1</td>
        <td>Rs. 745</td>
    </tr>

    <tr>
        <td colspan="3" class="total">
            Total Amount
        </td>

        <td>
            <b>Rs. 3744</b>
        </td>
    </tr>

</table>

<button class="button continue">
    ← Continue Shopping
</button>

<button class="button checkout">
    Proceed to Checkout →
</button>

<footer class="footer">
    Name: Ritika Gupta &nbsp; | &nbsp; Roll No.: 2501920110307
</footer>

</body>
</html>
