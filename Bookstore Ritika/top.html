<!DOCTYPE html>
<html>

<head>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

table {
    width: 100%;
    height: 100%;
    border-collapse: collapse;
    background-color: #0B1F3A;
    border: 2px solid black;
}

td {
    border: 2px solid black;
    text-align: center;
}

.logoRow {
    height: 75%;
}

.logoCell {
    width: 28%;
    border-right: none;
}

.titleCell {
    border-left: none;
    text-align: left;
    padding-left: 15px;
}

.logo {
    width: 210px;
}

.title {
    font-size: 44px;
    margin: 0;
    text-align: left;
    color: white;
}

.navRow {
    height: 25%;
}

.navRow td {
    padding: 12px 0;
    border: 2px solid black;
}

.navRow a {
    color: white;
    font-size: 22px;
    font-weight: bold;
    text-decoration: underline;
    text-decoration-color: #D4AF37;
    text-decoration-thickness: 2px;
    text-underline-offset: 8px;
}

</style>

</head>

<body>

<table>

    <tr class="logoRow">

        <td class="logoCell">
            <img src="logo.jpg" class="logo">
        </td>

        <td colspan="4" class="titleCell">
            <h1 class="title">
                G.L. Bajaj Online Book Store
            </h1>
        </td>

    </tr>

    <tr class="navRow">

        <td>
            <a href="home.html" target="rightFrame">
                Home
            </a>
        </td>

        <td>
            <a href="login.html" target="rightFrame">
                Login
            </a>
        </td>

        <td>
            <a href="register.html" target="rightFrame">
                Registration
            </a>
        </td>

        <td>
            <a href="catalogue.html" target="rightFrame">
                Catalogue
            </a>
        </td>

        <td>
            <a href="cart.html" target="rightFrame">
                Cart
            </a>
        </td>

    </tr>

</table>

</body>
</html>
